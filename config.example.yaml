# Пороги и веса. Всё, что подлежит калибровке, живёт здесь.
#
# Веса взяты из ТЗ §4.3 и объявлены там же СТАРТОВЫМИ. Пересматривать их
# следует по накопленной статистике из журнала, а не по впечатлению, и не
# раньше двух месяцев работы (ТЗ §12, этап 7). При изменении весов обязательно
# поднять SQUEEZE_FORMULA_VERSION в cryptomcp/__init__.py — иначе прошлые
# записи журнала станут несопоставимы с новыми, и накопленное пропадёт.

timeframes: ["1w", "1d", "4h", "1h", "15m"]

weights:
  volatility: 0.35
  range: 0.25
  volume: 0.20
  value_area: 0.10
  divergence: 0.10

# Перцентиль ширины диапазона по СОБСТВЕННОЙ истории монеты, ниже которого
# диапазон считается узким. Раньше здесь стояли абсолютные пороги из ТЗ
# (6–8% по таймфреймам); измерение показало, что при медианном дневном
# диапазоне рынка в 65% они не срабатывали ни у кого, кроме золотых токенов.
range_percentile: 20.0      # перцентиль ширины, ниже которого диапазон узкий

bbw_percentile: 20.0        # перцентиль BBW, ниже которого сжатие засчитано
atr_decline_bars: 10        # свечей снижения ATR для срабатывания признака
oi_change_threshold: 0.01   # порог значимости изменения открытого интереса
volume_profile_window: 200  # окно объёмного профиля, свечей (ТЗ: 100–200)
divergence_window: 40       # окно поиска дивергенций RSI (ТЗ: 30–50)

journal_path: "journal/squeeze.jsonl"
