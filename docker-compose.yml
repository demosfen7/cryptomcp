# Разворачивается в /opt/cryptomcp на Hetzner под пользователем deploy.
#
# Портов наружу не публикует: снаружи виден только общий Caddy, который ходит
# в контейнер по имени внутри сети briefgenerator_internal. Мост через
# 172.28.0.1 с правилами ufw здесь не нужен — он нужен пользователю vibecoding
# с rootless-докером, а deploy работает с тем же демоном, что и Caddy.

services:
  cryptomcp:
    build: .
    container_name: cryptomcp
    restart: unless-stopped
    environment:
      CRYPTOMCP_TRANSPORT: streamable-http
      CRYPTOMCP_HOST: 0.0.0.0
      CRYPTOMCP_PORT: 8000
      CRYPTOMCP_PUBLIC_HOST: cryptomcp.aithinglab.com
      CRYPTOMCP_PUBLIC_URL: https://cryptomcp.aithinglab.com
      CRYPTOMCP_LOG_LEVEL: INFO
      CRYPTOMCP_DB: /app/data/market.sqlite
      # Ключ входа на OAuth-странице и совместимый статический токен.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?нужен MCP_AUTH_TOKEN в .env}
      MCP_OAUTH_DB: /app/oauth/oauth.sqlite
    volumes:
      # Журнал индекса (PLAN §4.11) должен переживать пересборку образа:
      # его ценность именно в накоплении, начатом с первого дня.
      - cryptomcp_journal:/app/journal
      # Архив. Сервер из него ЧИТАЕТ (историю рядов), писатель — только
      # сборщик. Том смонтирован на запись, потому что читателю WAL всё равно
      # нужен доступ к -wal и -shm; дисциплину «пишет один» держит код, а не
      # права доступа.
      - cryptomcp_data:/app/data
      # Зарегистрированные OAuth-клиенты и refresh-токены переживают выкаты.
      - cryptomcp_oauth:/app/oauth
    networks:
      - briefgenerator_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Сборщик невосстановимых данных (PLAN §4.14). Отдельный контейнер, а не
  # поток внутри сервера: у них разные режимы отказа. Сервер, промолчавший час,
  # никому ничего не должен; сборщик, промолчавший час, теряет час открытого
  # интереса навсегда — биржа отдаёт только последние 30 суток.
  #
  # Наружу не смотрит, токена не знает, портов не публикует. Единственный
  # писатель в базу: MCP-сервер будет только читать.
  collector:
    build: .
    container_name: cryptomcp-collector
    restart: unless-stopped
    command: ["python", "-m", "cryptomcp.collector", "loop"]
    environment:
      CRYPTOMCP_LOG_LEVEL: INFO
      CRYPTOMCP_DB: /app/data/market.sqlite
      # Ядро, по которому пишутся деривативы. Пока не накоплен universe_daily,
      # отбор идёт по текущему обороту; когда накопится — по медиане за неделю.
      COLLECTOR_CORE_MIN_VOLUME: "50000000"
      COLLECTOR_MAX_SYMBOLS: "60"
      COLLECTOR_INTERVAL_S: "3600"
      # Уведомления о дельте списка наблюдения. Пустые значения — штатный
      # режим: сборщик просто не шлёт ничего. Уведомляет только сборщик,
      # MCP-серверу бот не нужен — он ничего не копит и дельты не знает.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      # Именованный том, а не папка проекта: деплой синхронизирует /opt/cryptomcp
      # с --delete, и база в рабочей папке стиралась бы при каждом выкате.
      - cryptomcp_data:/app/data
    # Свой healthcheck вместо унаследованного серверного: сборщик не слушает
    # порт, зато у него есть осмысленный признак живости — свежая запись в
    # collector_runs. Молчащий сборщик снаружи неотличим от работающего, и
    # проверка «был ли прогон за последние два интервала» закрывает ровно это.
    healthcheck:
      test: ["CMD", "python", "-m", "cryptomcp.collector", "health"]
      interval: 5m
      timeout: 10s
      start_period: 30m
      retries: 2
    networks:
      - briefgenerator_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Бот не является потоком сборщика: ошибка Telegram или сценария не должна
  # стоить часа невосстановимых деривативов.  Рыночный архив он только читает;
  # его bot.sqlite лежит рядом в том же томе (README Б1, Б6).
  bot:
    build: .
    container_name: cryptomcp-bot
    restart: unless-stopped
    command: ["python", "-m", "cryptomcp.bot", "loop"]
    environment:
      CRYPTOMCP_LOG_LEVEL: INFO
      CRYPTOMCP_DB: /app/data/market.sqlite
      CRYPTOMCP_BOT_DB: /app/data/bot.sqlite
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_ALLOWED_USER_IDS: ${BOT_ALLOWED_USER_IDS:-}
      # Ключ Claude есть только у бота: серверу и сборщику он не нужен, а
      # лишняя копия секрета — лишнее место, откуда он может утечь.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BOT_DAILY_BUDGET_USD: ${BOT_DAILY_BUDGET_USD:-1.0}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Europe/Berlin}
      BOT_MORNING_TIME: ${BOT_MORNING_TIME:-08:00}
    volumes:
      - cryptomcp_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-m", "cryptomcp.bot", "health", "--db", "/app/data/bot.sqlite"]
      interval: 1m
      timeout: 10s
      start_period: 1m
      retries: 3
    networks:
      - briefgenerator_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cryptomcp_journal:
  cryptomcp_data:
  cryptomcp_oauth:

networks:
  briefgenerator_internal:
    external: true
