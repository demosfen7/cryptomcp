name: test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: установка зависимостей
        run: pip install -e ".[dev]"

      - name: линт
        run: ruff check cryptomcp/ tests/

      - name: тесты
        # Тесты не ходят в сеть: всё на синтетических рядах, поэтому CI
        # не зависит от доступности Binance и не расходует лимит веса.
        run: pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: есть ли секреты для деплоя
        id: gate
        # Пока секреты не заданы, деплой пропускается, а не падает: иначе
        # красный крестик на каждом пуше начнёт маскировать настоящие поломки.
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ] && [ -n "${{ secrets.SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секреты деплоя не заданы — шаг пропущен."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - name: ключ SSH
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: выгрузка файлов
        if: steps.gate.outputs.ready == 'true'
        # Caddy-конфиг сознательно исключён: общий файл на сервере правится
        # вручную, чтобы деплой одного проекта не затирал роутинг соседнего.
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519" \
            --exclude '.git' --exclude '.venv' --exclude 'journal' \
            --exclude 'data' \
            --exclude 'deploy' --exclude '.github' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/cryptomcp/"

      - name: сборка и запуск
        if: steps.gate.outputs.ready == 'true'
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /opt/cryptomcp && \
             printf 'MCP_AUTH_TOKEN=%s\nTELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\nANTHROPIC_API_KEY=%s\nBOT_ALLOWED_USER_IDS=%s\nOPENAI_API_KEY=%s\n' \\
               '${{ secrets.MCP_AUTH_TOKEN }}' \\
               '${{ secrets.TELEGRAM_BOT_TOKEN }}' \\
               '${{ secrets.TELEGRAM_CHAT_ID }}' \\
               '${{ secrets.ANTHROPIC_API_KEY }}' \\
               '${{ secrets.BOT_ALLOWED_USER_IDS }}' \\
               '${{ secrets.OPENAI_API_KEY }}' > .env && \
             chmod 600 .env && \
             docker compose up -d --build && \
             docker image prune -f"

      - name: health-check
        if: steps.gate.outputs.ready == 'true'
        # Проверяем изнутри сети: снаружи ответ зависит ещё и от DNS с Caddy,
        # и падение здесь не отличить от проблемы с прокси.
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'for i in $(seq 1 20); do
               if docker exec cryptomcp python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3)" 2>/dev/null; then
                 echo "health ok"; exit 0
               fi
               sleep 3
             done
             echo "health не поднялся"; docker logs --tail 50 cryptomcp; exit 1'

      - name: проверка через домен
        if: steps.gate.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            https://cryptomcp.aithinglab.com/health || true)
          echo "внешний health: HTTP $code"
          test "$code" = "200"

  # Уведомление о результате. Отдельная работа, а не шаг внутри deploy: шаг
  # там не выполнился бы как раз в самом важном случае — когда упали тесты и
  # до деплоя дело не дошло. `needs` обе работы + `if: always()` дают
  # уведомление при любом исходе, включая «тесты красные, выката не было».
  notify:
    needs: [test, deploy]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: есть ли секреты для уведомления
        id: gate
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секреты Telegram не заданы — уведомление пропущено."
          fi

      - name: сообщение в Telegram
        if: steps.gate.outputs.ready == 'true'
        # Значения контекста передаются через env, а не подставляются в текст
        # скрипта: сообщение коммита пишет человек, и подстановка ${{ }} прямо
        # в shell выполнила бы то, что он там напишет.
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          case "$TEST_RESULT:$DEPLOY_RESULT" in
            success:success) head="✅ выкачен" ;;
            success:skipped) head="⏭ собран, выката не было" ;;
            success:*)       head="❌ выкат упал" ;;
            *)               head="❌ тесты не прошли, выката не было" ;;
          esac
          subject=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)
          text="cryptomcp: $head
          ${SHA:0:7} · $ACTOR
          ${subject:-без сообщения коммита}
          тесты: $TEST_RESULT · деплой: $DEPLOY_RESULT
          $RUN_URL"
          # Отступы съедаются здесь, а не в тексте сообщения.
          text=$(printf '%s' "$text" | sed 's/^[[:space:]]*//')
          # Недоставленное уведомление не повод красить сборку: выкат к этому
          # моменту уже случился, и его результат виден в Actions.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=$text" \
            --data-urlencode "disable_web_page_preview=true" || true)
          echo "telegram: HTTP $code"
